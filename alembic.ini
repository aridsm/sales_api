# Generic single-database configuration.

[alembic]
# path to migration scripts
script_location = migrations

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
#file_template = %%(rev)d_%%(created)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present
# defaults to the current directory
import_name = app

# timezone to use when rendering the creation date
# within the migration file as well as the filename.
# string value is passed to zoneinfo.ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# "slug" field when generating new migration file names
# set to -1 to disable downgrading
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# enabling the alembic.context.EnvironmentContext.get_context()
# function from within migration files
# is_return_render = false

# set to 'true' if you want to use sqlalchemy.url in the context of the
# engine used to generate migration files instead of the engine from the config
# sqlalchemy_url_placeholder = true

# a list of matching string patterns to consider as "pop" sources
# for each element is used, once on its own, then prepended to paths
# to files matching this pattern
# source_lexer = python
# populate_default_branches = true

# sqlalchemy.url driver://user:password@localhost/dbname
# Driver example: postgresql://scott:tiger@localhost/mydatabase

sqlalchemy.url = driver://user:password@localhost/dbname

[loggers]
keys = root,sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
